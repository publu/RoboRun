<!doctype html>
<html lang="en">
<head>
<script src="./runtime-base.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RoboRun · Run</title>
<link rel="stylesheet" href="./ui.css">
<script src="./shell.js"></script>
<script src="./run-detail.js"></script>
<style>
  *{ box-sizing:border-box; } body{ margin:0; background:var(--bg); color:var(--fg);
     font:14px/1.5 var(--mono); }
  header{ display:flex; align-items:center; gap:14px; padding:16px 24px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  header h1{ font-size:15px; margin:0; } header .id{ color:var(--fg-dim); font-size:12px; }
  main{ padding:22px 24px; max-width:1100px; margin:0 auto; }
  .grid{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  @media(max-width:760px){ .grid{ grid-template-columns:1fr; } }
  .panel{ background:var(--panel); border:1px solid var(--line); border-radius:var(--r); padding:14px; }
  .panel h2{ font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--fg-dim); margin:0 0 10px; display:flex; justify-content:space-between; align-items:center; }
  svg{ width:100%; display:block; }
  .empty{ color:var(--fg-dim); font-size:12px; padding:20px; text-align:center; }
  #detail{ margin-bottom:20px; }
  .phwrap{ position:relative; }
  .ph{ position:absolute; top:0; bottom:0; width:1px; background:var(--accent); opacity:.7; pointer-events:none; display:none; }
  .evlog{ max-height:200px; overflow:auto; font-size:12px; }
  .evlog .ev{ display:flex; gap:10px; padding:3px 0; border-bottom:1px solid var(--line-soft); color:var(--fg-2); }
  .evlog .ev.cur{ color:var(--fg); background:#0e150f; }
  .evlog .ev .t{ color:var(--fg-dim); width:64px; flex:none; }
</style>
</head>
<body>
<header>
  <h1>RUN</h1><span class="id" id="rid"></span>
  <nav class="nav">
    <a href="/">cockpit</a><a href="/browser">browser</a><a href="/projects">projects</a><a href="/scenarios">scenarios</a>
    <a href="/timeline">timeline</a><a href="/analytics">analytics</a>
    <a href="/fleet">fleet lab</a><a href="/search">search</a>
  </nav>
</header>
<main>
  <div id="detail"><div class="empty">loading…</div></div>

  <div class="panel" id="player" style="margin-bottom:16px;display:none">
    <h2>Synced replay <span id="ptime" style="color:var(--fg-dim)"></span>
      <span style="margin-left:auto;display:flex;gap:8px">
        <button id="play" class="btn sm accent" title="play / pause — every panel moves together">▶ play</button>
        <button id="flag" class="btn sm" title="flag this moment to revisit" style="color:var(--amber)">⚑ Flag</button>
      </span>
    </h2>
    <img id="pframe" style="width:100%;max-height:340px;object-fit:contain;background:#070907;border-radius:6px" alt="frame">
    <input id="scrub" type="range" min="0" max="1000" value="0" style="width:100%;margin-top:10px;accent-color:var(--accent)">
    <div id="incidents" style="margin-top:8px"></div>
  </div>

  <div class="seclabel" style="margin:4px 0 10px">Telemetry — one clock across every panel</div>
  <div class="grid">
    <div class="panel"><h2>Robot trajectory <span id="lblTraj"></span></h2><div id="traj" class="phwrap"></div></div>
    <div class="panel"><h2>Velocity <span style="color:var(--accent)">linear</span> · <span style="color:var(--blue)">angular</span></h2><div id="vel" class="phwrap"></div></div>
    <div class="panel"><h2>Obstacle clearance (m)</h2><div id="clear" class="phwrap"></div></div>
    <div class="panel"><h2>LiDAR scan</h2><div id="scan"></div></div>
    <div class="panel" style="grid-column:1/-1"><h2>Event log <span id="evcount" style="color:var(--fg-dim)"></span></h2><div id="events" class="evlog"></div></div>
  </div>
</main>
<script>
const $=s=>document.querySelector(s);
const qid=new URLSearchParams(location.search).get("id")||new URLSearchParams(location.search).get("run")||"";
$("#rid").textContent=qid;

function lineChart(el, series, keys, colors, H=160){
  const all=series.flatMap(p=>keys.map(k=>p[k]||0));
  if(!series.length){ el.innerHTML='<div class="empty">no data on this channel</div>'; return; }
  const W=460, min=Math.min(0,...all), max=Math.max(1e-6,...all), span=max-min||1;
  const X=i=>i/(series.length-1||1)*W, Y=v=>H-((v-min)/span)*(H-12)-6;
  const paths=keys.map((k,ki)=>`<path fill="none" stroke="${colors[ki]}" stroke-width="2" d="${series.map((p,i)=>`${i?'L':'M'}${X(i).toFixed(1)},${Y(p[k]||0).toFixed(1)}`).join(" ")}"/>`).join("");
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${paths}</svg>`;
}
function trajChart(el, pts, H=200){
  if(!pts.length){ el.innerHTML='<div class="empty">no pose recorded</div>'; return; }
  const xs=pts.map(p=>p[0]), zs=pts.map(p=>p[1]);
  const minX=Math.min(...xs),maxX=Math.max(...xs),minZ=Math.min(...zs),maxZ=Math.max(...zs);
  const W=460, sx=(maxX-minX)||1, sz=(maxZ-minZ)||1, pad=14;
  const X=x=>pad+((x-minX)/sx)*(W-2*pad), Y=z=>pad+((z-minZ)/sz)*(H-2*pad);
  const d=pts.map((p,i)=>`${i?'L':'M'}${X(p[0]).toFixed(1)},${Y(p[1]).toFixed(1)}`).join(" ");
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}"><path fill="none" stroke="var(--accent)" stroke-width="2" d="${d}"/>`
    +`<circle cx="${X(pts[0][0])}" cy="${Y(pts[0][1])}" r="4" fill="var(--amber)"/>`
    +`<circle cx="${X(pts.at(-1)[0])}" cy="${Y(pts.at(-1)[1])}" r="4" fill="var(--accent)"/></svg>`;
  $("#lblTraj").textContent=`${pts.length} pts`;
}
function scanChart(el, ranges, H=200){
  const v=ranges.filter(r=>r>0);
  if(!v.length){ el.innerHTML='<div class="empty">no lidar</div>'; return; }
  const W=460, cx=W/2, cy=H/2, R=Math.min(W,H)/2-10, max=Math.max(...v);
  const pts=ranges.map((r,i)=>{ const a=i/ranges.length*2*Math.PI; const rr=(r>0?r:max)/max*R;
    return `${(cx+Math.cos(a)*rr).toFixed(1)},${(cy-Math.sin(a)*rr).toFixed(1)}`; }).join(" ");
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}"><circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="var(--line)"/>`
    +`<polygon points="${pts}" fill="rgba(0,212,126,.12)" stroke="var(--accent)" stroke-width="1.5"/>`
    +`<circle cx="${cx}" cy="${cy}" r="3" fill="var(--accent)"/></svg>`;
}
async function loadRecord(){
  // the scored record → metadata/params/results/evaluation/tags (Antioch detail)
  try{
    const d=await (await fetch("/api/scenarios/by-run?run="+encodeURIComponent(qid))).json();
    const actions=`<a class="btn sm" href="/api/run/mcap/download?run=${encodeURIComponent(qid)}">↓ MCAP</a>`;
    renderRunRecord($("#detail"), d.result, {actions});
  }catch(e){ renderRunRecord($("#detail"), null, {}); }
}
async function load(){
  if(!qid){ $("#detail").innerHTML='<div class="empty">No run id. Open one from /scenarios or /timeline.</div>'; return; }
  loadRecord();
  let d; try{ d=await (await fetch("/api/run/series?id="+encodeURIComponent(qid))).json(); }catch(e){ return; }
  if(!d.ok){ return; }
  trajChart($("#traj"), d.trajectory||[]);
  lineChart($("#vel"), d.velocity||[], ["linear","angular"], ["var(--accent)","var(--blue)"]);
  lineChart($("#clear"), d.clearance||[], ["min"], ["var(--amber)"]);
  scanChart($("#scan"), d.scan||[]);
  setupPlayer(d);
}
let EVENTS=[];
function mkPlayhead(host){ const d=document.createElement("div"); d.className="ph"; host.appendChild(d); return d; }
function setupPlayer(d){
  const t0=d.t0, t1=d.t1, span=(t1-t0)||1;
  const hasFrames=(d.frames||[]).length && t0!=null;
  if(t0==null){ return; }
  $("#player").style.display="block";
  if(!hasFrames){ $("#pframe").style.display="none"; }
  const scrub=$("#scrub");
  const phVel=mkPlayhead($("#vel")), phClr=mkPlayhead($("#clear"));
  let curT=t0, timer=null;
  const show=()=>{
    const frac=scrub.value/1000; curT=t0+span*frac;
    $("#ptime").textContent=`t=${(curT-t0).toFixed(1)}s / ${span.toFixed(1)}s`;
    if(hasFrames) $("#pframe").src=`/api/run/frame?id=${encodeURIComponent(qid)}&t=${curT}`;
    // shared playhead across the time-series panels
    [phVel,phClr].forEach(p=>{ p.style.display="block"; p.style.left=(frac*100).toFixed(2)+"%"; });
    // sync the event log: highlight the latest event at/under t
    let curIdx=-1;
    for(let i=0;i<EVENTS.length;i++){ if(EVENTS[i].ts<=curT) curIdx=i; else break; }
    const rows=$("#events").children;
    for(let i=0;i<rows.length;i++) rows[i].classList.toggle("cur", i===curIdx);
    if(curIdx>=0 && rows[curIdx]) rows[curIdx].scrollIntoView({block:"nearest"});
  };
  scrub.oninput=()=>{ clearTimeout(timer); timer=setTimeout(show,40); show(); };
  // play / pause — advances the one clock all panels share
  let playing=false, raf=null, last=0;
  const tick=(now)=>{ if(!playing) return;
    if(last){ const dv=(now-last)/1000/span*1000; scrub.value=Math.min(1000, +scrub.value+dv); show();
      if(+scrub.value>=1000){ stop(); return; } }
    last=now; raf=requestAnimationFrame(tick);
  };
  const play=()=>{ playing=true; last=0; $("#play").textContent="⏸ pause"; raf=requestAnimationFrame(tick); };
  const stop=()=>{ playing=false; $("#play").textContent="▶ play"; if(raf)cancelAnimationFrame(raf); };
  $("#play").onclick=()=>{ playing?stop():play(); };
  scrub.value=0; show();
  $("#flag").onclick=async()=>{
    const note=prompt("Note for this moment (optional):")||"";
    await fetch("/api/incidents/flag",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({run_id:qid,ts:curT,note})});
    loadIncidents();
  };
  loadIncidents(); loadEvents();
}
async function loadEvents(){
  try{
    const d=await (await fetch("/api/run/events?run="+encodeURIComponent(qid)+"&limit=500")).json();
    EVENTS=(d.events||[]).filter(e=>e.ts).sort((a,b)=>a.ts-b.ts);
    $("#evcount").textContent=EVENTS.length?`(${EVENTS.length})`:"";
    const tm=ts=>new Date(ts*1000).toLocaleTimeString();
    $("#events").innerHTML=EVENTS.length? EVENTS.map(e=>
      `<div class="ev"><span class="t">${tm(e.ts)}</span><span>${(e.type||"")}/${(e.source||"")} · ${e.title||""}</span></div>`).join("")
      : '<div class="empty">No events recorded for this run.</div>';
  }catch(e){ $("#events").innerHTML='<div class="empty">—</div>'; }
}
async function loadIncidents(){
  try{ const d=await (await fetch("/api/incidents?run="+encodeURIComponent(qid))).json();
    const el=$("#incidents");
    el.innerHTML=(d.incidents||[]).map(i=>`<span class="chip" style="color:var(--amber);border-color:#3a3015">⚑ ${i.note||i.tag}</span>`).join("");
  }catch(e){}
}
load();
</script>
</body>
</html>
