<!doctype html>
<html lang="en">
<head>
<script src="./runtime-base.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RoboRun · Home</title>
<link rel="stylesheet" href="./ui.css">
<script src="./shell.js"></script>
<style>
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--fg); font:14px/1.5 var(--mono); }

  /* ── section heading ─────────────────────────────────────────────────── */
  .sec{ display:flex; align-items:baseline; gap:10px; margin:30px 0 13px; }
  .sec:first-of-type{ margin-top:26px; }
  .sec .t{ font-size:11px; text-transform:uppercase; letter-spacing:.14em; color:var(--fg-dim); }
  .sec .sub{ font-size:11px; color:var(--fg-dim); opacity:.8; }
  .sec a.more{ margin-left:auto; font-size:11px; color:var(--accent); text-decoration:none;
    border-bottom:1px solid transparent; transition:border-color .12s; }
  .sec a.more:hover{ border-bottom-color:var(--accent); }

  /* ── hero ────────────────────────────────────────────────────────────── */
  .hero{ position:relative; overflow:hidden;
    background:
      radial-gradient(120% 140% at 100% 0%, rgba(0,212,126,.10), transparent 60%),
      linear-gradient(180deg,#0e1a12,#0b110d);
    border:1px solid var(--accent-dim); border-radius:var(--r);
    padding:22px 24px; box-shadow:var(--shadow); }
  .hero::after{ content:""; position:absolute; right:-40px; top:-40px; width:200px; height:200px;
    border-radius:50%; background:radial-gradient(circle, rgba(0,212,126,.08), transparent 70%);
    pointer-events:none; }
  .hero .top{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .hero .scope{ font-size:12px; color:var(--fg-2); display:flex; align-items:center; gap:8px;
    flex-wrap:wrap; }
  .hero .scope b{ color:var(--accent); }
  .hero .scope .sep{ color:var(--fg-dim); opacity:.5; }
  .hero .live{ margin-left:auto; display:inline-flex; align-items:center; gap:7px;
    font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--fg-dim);
    border:1px solid var(--line); border-radius:999px; padding:3px 10px; background:rgba(0,0,0,.2); }
  .hero .live .dot{ width:7px; height:7px; border-radius:50%; background:var(--ok);
    box-shadow:0 0 0 0 rgba(0,212,126,.5); animation:pulse 2.2s infinite; }
  @keyframes pulse{ 0%{ box-shadow:0 0 0 0 rgba(0,212,126,.45); } 70%{ box-shadow:0 0 0 6px rgba(0,212,126,0); } 100%{ box-shadow:0 0 0 0 rgba(0,212,126,0); } }
  .hero h1{ font-size:21px; margin:11px 0 3px; letter-spacing:.01em; }
  .hero .lead{ font-size:12.5px; color:var(--fg-2); max-width:62ch; }
  .hero .acts{ display:flex; gap:9px; flex-wrap:wrap; margin-top:16px; }

  /* ── environments grid ───────────────────────────────────────────────── */
  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(248px,1fr)); gap:12px; }
  .ecard{ position:relative; display:flex; flex-direction:column;
    background:var(--panel); border:1px solid var(--line); border-radius:var(--r);
    padding:15px 16px 14px; cursor:pointer; min-height:128px;
    transition:border-color .15s, background .15s, transform .12s; }
  .ecard:hover{ border-color:var(--accent); background:var(--panel-2); transform:translateY(-1px); }
  .ecard.on{ border-color:var(--accent-dim); background:#0e1a12; }
  .ecard.on::before{ content:""; position:absolute; left:0; top:14px; bottom:14px; width:2px;
    border-radius:2px; background:var(--accent); }
  .ecard .nm{ font-weight:600; font-size:14px; color:var(--fg); display:flex;
    justify-content:space-between; align-items:flex-start; gap:8px; }
  .ecard .badges{ display:flex; flex-wrap:wrap; gap:5px; margin-top:9px; }
  .ecard .b{ font-size:10.5px; text-transform:uppercase; letter-spacing:.05em;
    color:var(--fg-2); background:var(--panel-2); border:1px solid var(--line);
    border-radius:var(--r-sm); padding:2px 7px; }
  .ecard.on .b{ background:rgba(0,0,0,.25); }
  .ecard .b.backend{ color:var(--blue); border-color:rgba(64,144,224,.25); }
  .ecard .stats{ margin-top:auto; padding-top:12px; display:flex; align-items:baseline;
    gap:12px; font-size:11px; color:var(--fg-dim); }
  .ecard .stats .v{ color:var(--fg-2); font-weight:600; }
  .ecard .go{ margin-left:auto; color:var(--accent); opacity:0; transition:opacity .15s;
    font-size:11px; font-weight:600; }
  .ecard:hover .go, .ecard.on .go{ opacity:1; }

  /* ── KPI row ─────────────────────────────────────────────────────────── */
  .kpis{ grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); }
  .kpi{ background:var(--panel); position:relative; }
  .kpi .n .u{ font-size:13px; color:var(--fg-2); font-weight:600; margin-left:1px; }
  .kpi .sub{ font-size:10.5px; color:var(--fg-dim); margin-top:3px; }

  /* ── recent runs ─────────────────────────────────────────────────────── */
  .runs{ display:flex; flex-direction:column; gap:6px; }
  .runrow{ display:flex; align-items:center; gap:14px; background:var(--panel);
    border:1px solid var(--line); border-radius:var(--r-sm); padding:11px 14px;
    text-decoration:none; color:var(--fg); transition:border-color .15s, background .15s; }
  .runrow:hover{ border-color:var(--accent); background:var(--panel-2); }
  .runrow .ic{ width:8px; height:8px; border-radius:50%; flex:none; background:var(--fg-dim); }
  .runrow .ic.anchored{ background:var(--ok); }
  .runrow .ic.sealed{ background:var(--warn); }
  .runrow .nm{ font-size:13px; font-weight:600; color:var(--fg); white-space:nowrap; }
  .runrow .meta{ color:var(--fg-dim); font-size:11px; white-space:nowrap; }
  .runrow .meta .v{ color:var(--fg-2); }
  .runrow .grow{ flex:1; min-width:8px; }
  .runrow .when{ color:var(--fg-dim); font-size:11px; white-space:nowrap; }
  @media (max-width:560px){ .runrow .when{ display:none; } .runrow .nm{ white-space:normal; word-break:break-all; } }

  /* ── empty / offline ─────────────────────────────────────────────────── */
  .empty{ color:var(--fg-2); padding:26px 22px; text-align:center; background:var(--panel);
    border:1px dashed var(--line); border-radius:var(--r); font-size:12.5px; }
  .empty .big{ font-size:13px; color:var(--fg); margin-bottom:5px; }
  .empty a{ color:var(--accent); text-decoration:none; } .empty a:hover{ text-decoration:underline; }
  .offline{ position:relative; overflow:hidden;
    background:linear-gradient(180deg,#1a160e,#15120b);
    border:1px solid #3a3015; border-radius:var(--r); padding:22px 24px; color:var(--fg-2);
    box-shadow:var(--shadow); }
  .offline .h{ display:flex; align-items:center; gap:10px; font-size:14px; color:var(--fg);
    font-weight:600; margin-bottom:8px; }
  .offline .h .dot{ width:9px; height:9px; border-radius:50%; background:var(--amber); flex:none; }
  .offline .body{ font-size:12.5px; line-height:1.65; max-width:64ch; }
  .offline b{ color:var(--amber); }
  .offline code{ color:var(--fg); background:#0c0f0c; border:1px solid #2a2410; padding:2px 8px;
    border-radius:5px; font-size:12px; }
  .offline a{ color:var(--accent); text-decoration:none; } .offline a:hover{ text-decoration:underline; }
  .offline .acts{ display:flex; gap:9px; flex-wrap:wrap; margin-top:15px; }

  .skel{ color:var(--fg-dim); padding:22px; text-align:center; background:var(--panel);
    border:1px solid var(--line-soft); border-radius:var(--r); font-size:12px; opacity:.7; }
</style>
</head>
<body>
<main>
  <div id="hero"></div>
  <div class="sec"><span class="t">Environments</span><span class="sub" id="envsub"></span><a class="more" href="/setup">+ new</a></div>
  <div id="envs" class="grid"><div class="skel">loading environments…</div></div>
  <div class="sec"><span class="t">Data overview</span><a class="more" href="/browser">explore →</a></div>
  <div id="kpis" class="kpis"></div>
  <div class="sec"><span class="t">Recent runs</span><a class="more" href="/browser">browse all →</a></div>
  <div id="runs" class="runs"></div>
</main>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const when=t=>t?new Date((typeof t==="number"?t*1000:Date.parse(t))).toLocaleString():"";
function ago(t){
  if(!t) return "";
  const ms=(typeof t==="number"?t*1000:Date.parse(t));
  const s=Math.max(0,(Date.now()-ms)/1000);
  if(s<60) return "just now";
  if(s<3600) return Math.floor(s/60)+"m ago";
  if(s<86400) return Math.floor(s/3600)+"h ago";
  if(s<604800) return Math.floor(s/86400)+"d ago";
  return new Date(ms).toLocaleDateString();
}
function dur(a,b){ if(!a||!b) return ""; const s=Math.max(0,b-a);
  if(s<60) return s.toFixed(s<10?1:0)+"s"; const m=Math.floor(s/60); return m+"m "+Math.round(s%60)+"s"; }
function nfmt(n){ n=Number(n)||0; if(n>=1e6) return (n/1e6).toFixed(1).replace(/\.0$/,"")+"M";
  if(n>=1e3) return (n/1e3).toFixed(1).replace(/\.0$/,"")+"k"; return String(n); }
function sizefmt(b){ b=Number(b)||0; if(b>=1e9) return (b/1e9).toFixed(1)+"G";
  if(b>=1e6) return (b/1e6).toFixed(1)+"M"; if(b>=1e3) return (b/1e3).toFixed(0)+"K"; return b+"B"; }
async function j(u){ const r=await fetch(u); if(!r.ok) throw 0; return r.json(); }
async function post(u,b){ return (await fetch(u,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b||{})})).json(); }

async function loadHero(){
  let a=null; try{ a=await j("/api/projects/active"); }catch(e){ offline(); return; }
  const act=a.active;
  const scoped=!!act;
  $("#hero").innerHTML=`<div class="hero">
    <div class="top">
      <div class="scope">${scoped
        ? `project <b>${esc(act.project)}</b><span class="sep">·</span>environment <b>${esc(act.environment)}</b>`
        : `<b>scratch</b><span class="sep">·</span><span>unscoped default — create a project to isolate your work</span>`}</div>
      <span class="live"><span class="dot"></span>runtime online</span>
    </div>
    <h1>${scoped?"Welcome back":"Set up your first robot"}</h1>
    <div class="lead">${scoped
        ? "Your local runtime is recording and indexing. Launch a sim, open the cockpit, or browse what your robots have seen."
        : "RoboRun is live locally. Spin up a sim or robot, then everything you record becomes searchable, replayable, and verifiable."}</div>
    <div class="acts">
      <a class="btn accent" href="/setup">▣ New sim / robot</a>
      <a class="btn" href="/sim">▦ Open cockpit</a>
      <a class="btn" href="/fleet-sim">🐝 3D fleet sim</a>
      <a class="btn" href="/browser">⊞ Browse data</a>
    </div></div>`;
}
function offline(){
  $("#hero").innerHTML=`<div class="offline">
    <div class="h"><span class="dot"></span>No local runtime detected</div>
    <div class="body">Run <code>roborun</code> in your terminal to bring projects, recording, replay and spatial search online — this page upgrades automatically the moment it connects. In the meantime you can explore the fully in-browser simulator.</div>
    <div class="acts">
      <a class="btn accent" href="/sim">▦ Try the in-browser sim →</a>
      <a class="btn" href="/fleet-sim">🐝 3D fleet sim</a>
    </div></div>`;
  $("#envs").innerHTML=""; $("#kpis").innerHTML=""; $("#runs").innerHTML="";
  document.querySelectorAll(".sec").forEach(s=>s.style.display="none");
}
async function loadEnvs(){
  let a; try{ a=await j("/api/projects/active"); }catch(e){ return; }
  const proj=(a.active||{}).project;
  const el=$("#envs"), sub=$("#envsub");
  if(!proj){
    el.classList.remove("grid");
    el.innerHTML=`<div class="empty">
      <div class="big">You're in <b>scratch</b> — no project selected.</div>
      Create a project to group environments, robots and runs.
      <div style="margin-top:10px"><a class="btn sm accent" href="/setup">▣ Set up an environment →</a></div>
    </div>`;
    return;
  }
  let d; try{ d=await j("/api/environments?project="+encodeURIComponent(proj)); }catch(e){ return; }
  if(!d.environments||!d.environments.length){
    el.classList.remove("grid");
    el.innerHTML=`<div class="empty">
      <div class="big">No environments in <b>${esc(proj)}</b> yet.</div>
      An environment pairs a backend (sim or robot) with a mode.
      <div style="margin-top:10px"><a class="btn sm accent" href="/setup">▣ Create one →</a></div>
    </div>`;
    return;
  }
  el.classList.add("grid");
  if(sub) sub.textContent=d.environments.length+(d.environments.length===1?" environment":" environments");
  el.innerHTML=d.environments.map(e=>{
    const on=a.active&&a.active.environment===e.id;
    const surface="/sim";
    const cams=(e.cameras||[]).length;
    return `<div class="ecard${on?' on':''}" data-p="${esc(proj)}" data-e="${esc(e.id)}" data-s="${surface}">
      <div class="nm"><span>${esc(e.name)}</span>${on?'<span class="pill ok">active</span>':''}</div>
      <div class="badges">
        <span class="b backend">${esc(e.backend||"—")}</span>
        <span class="b">${esc(e.mode||"—")}</span>
        ${cams?`<span class="b">${cams} cam${cams>1?'s':''}</span>`:''}
      </div>
      <div class="stats">
        <span><span class="v">${e.runs||0}</span> run${(e.runs||0)===1?'':'s'}</span>
        ${e.last_run?`<span>${esc(ago(e.last_run))}</span>`:'<span>no runs yet</span>'}
        <span class="go">open ▶</span>
      </div>
    </div>`;
  }).join("");
  el.querySelectorAll(".ecard").forEach(c=>c.onclick=async()=>{
    await post("/api/projects/active",{project:c.dataset.p,environment:c.dataset.e});
    location.href=c.dataset.s;
  });
}
async function loadKpis(){
  let d; try{ d=await j("/api/analytics"); }catch(e){ return; }
  const obs=d.observations||{}, runs=d.runs||{}, st=d.storage||{}, suites=d.suites||[];
  const fleet=d.fleet||{};
  // suite pass rate (if any suites)
  let passRate=null, suiteRuns=0;
  if(suites.length){ let p=0,r=0; suites.forEach(s=>{ p+=s.passed||0; r+=s.runs||0; });
    suiteRuns=r; passRate=r?Math.round(100*p/r):null; }
  const kpi=(n,l,sub)=>`<div class="kpi"><div class="n">${n}</div><div class="l">${l}</div>${sub?`<div class="sub">${sub}</div>`:""}</div>`;
  const tiles=[
    kpi(nfmt(runs.count??0),"total runs", `${runs.anchored??0} anchored · ${runs.sealed??0} sealed`),
    kpi(nfmt(obs.total??0),"things seen", `${nfmt(obs.detections??0)} detections`),
    kpi(nfmt(obs.with_position??0),"localized", "with map position"),
    kpi((st.used_gb!=null?st.used_gb:0)+'<span class="u">G</span>',"stored",
        st.cap_gb!=null?`of ${st.cap_gb}G cap · ${st.pct??0}%`:""),
  ];
  if(passRate!=null) tiles.push(kpi(passRate+'<span class="u">%</span>',"suite pass rate", `${suiteRuns} scenario run${suiteRuns===1?'':'s'}`));
  else tiles.push(kpi(nfmt(suites.length),"suites","evaluation"));
  $("#kpis").innerHTML=tiles.join("");
}
async function loadRuns(){
  let d; try{ d=await j("/api/runs"); }catch(e){ return; }
  const el=$("#runs"); const rs=(d.runs||[]).slice(0,6);
  if(!rs.length){ el.innerHTML='<div class="empty"><div class="big">No runs in this scope yet.</div>Record in the cockpit (press <b>M</b>), run a scenario, or start a fleet sim.</div>'; return; }
  el.innerHTML=rs.map(r=>{ const m=r.manifest||{};
    const state=r.anchored?"anchored":r.sealed?"sealed":"open";
    const d2=dur(m.started,m.ended);
    return `<a class="runrow" href="/run?id=${encodeURIComponent(r.run)}">
      <span class="ic ${state}"></span>
      <span class="nm">${esc(r.run)}</span>
      <span class="meta"><span class="v">${esc(r.robot_id||"—")}</span>${m.backend?" · "+esc(m.backend):""}${d2?" · "+d2:""}${r.size?" · "+sizefmt(r.size):""}</span>
      <span class="grow"></span>
      <span class="when">${ago(m.ended||m.started||r.sealed_at)}</span>
      ${r.anchored?'<span class="pill ok">anchored</span>':r.sealed?'<span class="pill warn">sealed</span>':'<span class="pill">open</span>'}</a>`;
  }).join("");
}
loadHero(); loadEnvs(); loadKpis(); loadRuns();
</script>
</body>
</html>
