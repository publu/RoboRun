<!doctype html>
<html lang="en">
<head>
<script src="./runtime-base.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RoboRun · Search over time</title>
<link rel="stylesheet" href="./ui.css">
<style>
  :root{ --bg:#0b0e0c; --panel:#11150f; --line:#1e2a1f; --fg:#e6f0e8; --dim:#7aaf90;
         --accent:#00d47e; --red:#e0563f; }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--fg);
        font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace; }
  header{ display:flex; align-items:center; gap:14px; padding:16px 24px;
          border-bottom:1px solid var(--line); flex-wrap:wrap; }
  header h1{ font-size:15px; margin:0; letter-spacing:.5px; }
  header nav{ margin-left:auto; display:flex; gap:14px; }
  header nav a{ color:var(--dim); text-decoration:none; font-size:12px; }
  header nav a:hover, header nav a.on{ color:var(--accent); }
  .bar{ display:flex; gap:8px; padding:16px 24px; flex-wrap:wrap; align-items:center;
        border-bottom:1px solid var(--line); }
  input,select,button{ background:var(--panel); color:var(--fg); border:1px solid var(--line);
        border-radius:7px; padding:8px 12px; font:inherit; font-size:13px; }
  input#q{ flex:1; min-width:240px; }
  button{ cursor:pointer; }
  button.go{ background:var(--accent); color:#06120c; border-color:var(--accent); font-weight:600; }
  .seg{ display:flex; border:1px solid var(--line); border-radius:7px; overflow:hidden; }
  .seg button{ border:0; border-radius:0; background:var(--panel); color:var(--dim); }
  .seg button.on{ background:rgba(0,212,126,.15); color:var(--accent); }
  main{ padding:20px 24px; }
  .meta{ color:var(--dim); font-size:12px; margin-bottom:14px; }
  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:14px; }
  .card{ background:var(--panel); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .card img{ width:100%; height:140px; object-fit:cover; background:#070907; display:block; }
  .card .noimg{ height:140px; display:flex; align-items:center; justify-content:center; color:var(--dim); font-size:11px; }
  .card .b{ padding:10px 12px; }
  .chips{ display:flex; flex-wrap:wrap; gap:4px; margin-bottom:6px; }
  .chip{ background:rgba(0,212,126,.13); color:var(--accent); border-radius:999px; padding:1px 8px; font-size:11px; }
  .when{ color:var(--dim); font-size:11px; }
  .src{ color:var(--dim); font-size:10px; text-transform:uppercase; letter-spacing:.5px; }
  .empty{ color:var(--dim); padding:50px; text-align:center; }
</style>
</head>
<body>
<header>
  <h1>🔍 SEARCH OVER TIME</h1>
  <nav>
    <a href="/">cockpit</a><a href="/scenarios">scenarios</a>
    <a href="/timeline">timeline</a><a href="/analytics">analytics</a>
    <a href="/fleet">fleet lab</a><a href="/search" class="on">search</a>
  </nav>
</header>
<div class="bar">
  <div class="seg" id="mode" title="how to match — by meaning, by exact object, or the uncertain detections worth labeling (active learning)">
    <button data-by="clip" class="on">by meaning</button>
    <button data-by="label">by object</button>
    <button data-by="uncertain" title="the examples the model is unsure about — curate these to label and improve it">needs labeling</button>
  </div>
  <input id="q" placeholder="who/what to find — 'person in red', 'forklift', 'red mug'…"
         onkeydown="if(event.key==='Enter')run()">
  <label class="src">from</label><input id="since" type="datetime-local" title="only show results after this time">
  <label class="src">to</label><input id="until" type="datetime-local" title="only show results before this time">
  <input id="source" placeholder="which camera? (optional)" style="width:150px" title="limit to one camera, e.g. front or dock">
  <button class="go" onclick="run()">Search</button>
  <button onclick="exportDs()" title="save these results as a labeled training dataset (images + labels), with verifiable provenance">⤓ Save as dataset</button>
</div>
<main>
  <div class="meta" id="meta">Find any object or person across everything your robots have ever recorded — sim, real robots, and cameras. Type what you're looking for, or narrow it to a time range.</div>
  <div class="grid" id="grid"></div>
</main>
<script>
const $=s=>document.querySelector(s);
let by="clip";
$("#mode").querySelectorAll("button").forEach(b=>b.onclick=()=>{
  by=b.dataset.by; $("#mode").querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));
});
const toEpoch=v=> v? Math.floor(new Date(v).getTime()/1000): undefined;

async function exportDs(){
  const q=$("#q").value.trim(); if(!q){ $("#meta").textContent="Type a query to export."; return; }
  $("#meta").textContent="Curating dataset…";
  const body={query:q, by, since:toEpoch($("#since").value), until:toEpoch($("#until").value)};
  try{ const r=await (await fetch("/api/search/export",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)})).json();
    $("#meta").textContent=`Dataset curated: ${r.count} images + labels.jsonl → ${r.dir}`;
  }catch(e){ $("#meta").textContent="Export failed: "+e; }
}
async function run(){
  const body={ query:$("#q").value.trim(), by, k:60 };
  const s=toEpoch($("#since").value), u=toEpoch($("#until").value);
  if(s) body.since=s; if(u) body.until=u;
  if($("#source").value.trim()) body.source_id=$("#source").value.trim();
  if(!body.query && by!=="time" && by!=="uncertain"){ $("#meta").textContent="Type something to find."; return; }
  if(by==="uncertain" && !body.query){ $("#meta").textContent="Finding the examples the model is unsure about…"; }
  $("#meta").textContent="Searching…";
  let d; try{ d=await (await fetch("/api/search",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)})).json(); }
  catch(e){ $("#meta").textContent="Search failed: "+e; return; }
  const rows=d.results||[];
  $("#meta").textContent=`${rows.length} hit${rows.length!==1?"s":""} across all history`
    +(body.since||body.until?" · time-windowed":"");
  $("#grid").innerHTML = rows.length? rows.map(r=>{
    const labels=[...new Set((r.detections||[]).map(x=>x.label))];
    const when=new Date((r.ts||0)*1000).toLocaleString();
    const score = r.score!=null? ` · ${(r.score*100|0)}%`:"";
    const img = r.id? `<img loading="lazy" src="/api/memory/thumb/${r.id}" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'noimg',textContent:'no thumbnail'}))">`
                    : `<div class="noimg">no thumbnail</div>`;
    return `<div class="card">${img}<div class="b">
      <div class="chips">${labels.map(l=>`<span class="chip">${l}</span>`).join("")||'<span class="when">no labels</span>'}</div>
      <div class="when">${when}${score}</div>
      <div class="src">${r.source||"?"} · ${r.source_id||r.robot_id||""}</div>
    </div></div>`;
  }).join("") : `<div class="empty">Nothing found yet.<br><br>If this is a fresh install, there's no data to search — record a run (open the cockpit and press <b>M</b>) or run <code>roborun demo</code> in your terminal to load sample data. Already have runs? Try the <b>by object</b> tab or widen the time range.</div>`;
}

// First-run: greet a brand-new user with a 3-step quick start (only when empty).
async function firstRun(){
  try{
    const d=await (await fetch("/api/analytics")).json();
    if((d.observations?.total||0) > 0) return;   // there's data → no onboarding
    $("#grid").innerHTML = `<div class="empty" style="text-align:left;max-width:560px;margin:0 auto">
      <div style="font-size:15px;color:var(--fg);margin-bottom:14px">👋 Welcome — let's get something to search.</div>
      <div style="margin:8px 0"><b style="color:var(--accent)">1.</b> In your terminal, run <code>roborun demo</code> — it records a few sample runs and indexes them. <i>(Quickest win.)</i></div>
      <div style="margin:8px 0"><b style="color:var(--accent)">2.</b> Or open the <a href="/" style="color:var(--accent)">cockpit</a>, start a sim or camera, and press <b>M</b> to record.</div>
      <div style="margin:8px 0"><b style="color:var(--accent)">3.</b> Then come back and search — by meaning ("person in red") or by object ("forklift"), across everything, over all of time.</div>
      <div style="margin-top:14px;font-size:12px">Once data exists, this page becomes your robots' memory: find anyone or anything they've ever seen, and export the results as a labeled dataset with verifiable provenance.</div>
    </div>`;
  }catch(e){}
}
firstRun();
</script>
</body>
</html>
