<!doctype html>
<html lang="en">
<head>
<script src="./runtime-base.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RoboRun · Fleet Sim</title>
<link rel="stylesheet" href="./ui.css">
<script src="./project-chip.js"></script>
<style>
  *{ box-sizing:border-box; } body{ margin:0; background:var(--bg); color:var(--fg); font:14px/1.5 var(--mono); }
  header{ display:flex; align-items:center; gap:14px; padding:14px 22px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  header h1{ font-size:15px; margin:0; }
  nav.nav{ margin-left:auto; }
  main{ padding:18px 22px; max-width:1300px; margin:0 auto; }
  .controls{ display:flex; gap:14px; align-items:center; flex-wrap:wrap; margin-bottom:14px; }
  .controls label{ color:var(--fg-dim); font-size:12px; }
  input[type=range]{ accent-color:var(--accent); }
  .kpis{ display:flex; gap:10px; flex-wrap:wrap; margin-left:auto; }
  .floors{ display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:14px; }
  .floor{ background:var(--panel); border:1px solid var(--line); border-radius:var(--r); padding:10px; }
  .floor h2{ font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--fg-dim); margin:0 0 8px; display:flex; justify-content:space-between; }
  canvas{ width:100%; height:auto; display:block; background:#080b08; border-radius:6px; image-rendering:auto; }
  .scope{ background:#0e1a12; border:1px solid var(--accent-dim); border-radius:var(--r); padding:9px 14px; font-size:12px; margin-bottom:12px; }
  .scope b{ color:var(--accent); }
</style>
</head>
<body>
<header>
  <h1>🐝 FLEET SIM</h1>
  <nav class="nav">
    <a href="/">cockpit</a><a href="/browser">browser</a><a href="/projects">projects</a>
    <a href="/scenarios">scenarios</a><a href="/search">search</a>
  </nav>
</header>
<main>
  <div class="scope" id="scope">A swarm of robots covering one large warehouse, across floors, via elevators — collecting detections jointly into the active project's environment.</div>
  <div class="controls">
    <label>robots <b id="nlab">8</b></label><input id="n" type="range" min="1" max="40" value="8">
    <label>floors <b id="flab">3</b></label><input id="fl" type="range" min="1" max="4" value="3">
    <label>speed <b id="slab">1.0×</b></label><input id="spd" type="range" min="1" max="40" value="10">
    <button id="play" class="btn accent">⏸ pause</button>
    <button id="reset" class="btn">↺ reset</button>
    <div class="kpis" id="kpis"></div>
  </div>
  <div class="floors" id="floors"></div>
</main>
<script src="./fleet-sim.js"></script>
</body>
</html>
