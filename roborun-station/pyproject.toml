[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "roborun-station"
version = "0.1.0"
description = "Roborun station: the station logic around your arm adapters (leases, Stop/hold, Home), plus simulated YAM / Metal stations and cameras with fault injection (pure Python)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Roborun" }]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
classifiers = ["Development Status :: 4 - Beta", "Intended Audience :: Developers", "Operating System :: OS Independent", "Programming Language :: Python :: 3"]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
